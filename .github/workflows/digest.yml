name: Gmail News Digest

on:
  schedule:
    # Respaldos TARDÍOS (hora Chile verano, UTC-3). GitHub atrasa estos disparos
    # entre 2,8 y 8,8 horas (medido 8 al 22-oct-2026; mediana 4,5 horas), así que
    # solo sirven como red de seguridad si falla el disparador principal. Si el
    # informe del día ya salió,
    # se omiten solos (control por fecha calendario de Santiago en el código).
    - cron: '35 11 * * *'   # 8:35 nominal
    - cron: '5 12 * * *'    # 9:05 nominal
    - cron: '45 12 * * *'   # 9:45 nominal
  workflow_dispatch:         # DISPARADOR PRINCIPAL: tarea programada de Claude a las 8:20 Chile
                             # (vía conexión GitHub en Composio); también manual.
    inputs:
      modo:
        description: 'normal = resumen diario; solo-audio = regenera y envía solo el MP3 del último resumen'
        required: false
        default: normal
        type: choice
        options: [normal, solo-audio]
      omitir:
        description: 'solo-audio: fragmentos iniciales a omitir (para generar la continuación de un audio parcial)'
        required: false
        default: '0'

# Evita que dos disparos cercanos corran en paralelo. El segundo espera en cola,
# así el control de idempotencia siempre ve el last_run.json ya actualizado.
concurrency:
  group: gmail-news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm install   # incluye ffmpeg estático (@ffmpeg-installer/ffmpeg) para el MP3

      - name: Escribir archivo .env
        run: echo "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Escribir credenciales OAuth2
        run: |
          mkdir -p credentials
          echo "$OAUTH_CREDENTIALS" > credentials/oauth2.json
        env:
          OAUTH_CREDENTIALS: ${{ secrets.OAUTH_CREDENTIALS }}

      - name: Escribir token OAuth2
        run: |
          mkdir -p tokens
          echo "$OAUTH_TOKEN" > tokens/token.json
        env:
          OAUTH_TOKEN: ${{ secrets.OAUTH_TOKEN }}

      - name: Ejecutar pipeline
        run: node src/index.js ${{ inputs.modo == 'solo-audio' && '--audio-only' || '--run-now' }}
        env:
          AUDIO_SKIP_CHUNKS: ${{ inputs.modo == 'solo-audio' && inputs.omitir || '0' }}

      - name: Guardar last_run.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.json
          git diff --staged --quiet || git commit -m "chore: update last run timestamp"
          git push
